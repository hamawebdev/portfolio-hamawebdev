<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Form Submission</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1F2937;
            background-color: #F3F4F6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header {
            background: linear-gradient(135deg, #6B7280, #4B5563);
            color: white;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
        }

        .content {
            padding: 2rem;
        }

        .intro {
            margin-bottom: 2rem;
            color: #374151;
            font-size: 1rem;
        }

        .field {
            margin-bottom: 1.5rem;
        }

        .label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #4B5563;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            margin-bottom: 0.5rem;
        }

        .value {
            background: #F9FAFB;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #6B7280;
            font-size: 1rem;
            color: #1F2937;
            word-wrap: break-word;
        }

        .footer {
            padding: 1.5rem;
            text-align: center;
            background: #F9FAFB;
            border-top: 1px solid #E5E7EB;
            color: #6B7280;
            font-size: 0.875rem;
        }

        .footer a {
            color: #6B7280;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 0;
            }

            .header {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .content {
                padding: 1.5rem;
            }

            .value {
                font-size: 0.875rem;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1F2937;
                color: #F3F4F6;
            }

            .container {
                background: #374151;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            }

            .header {
                background: linear-gradient(135deg, #4B5563, #6B7280);
            }

            .intro {
                color: #D1D5DB;
            }

            .label {
                color: #9CA3AF;
            }

            .value {
                background: #4B5563;
                color: #F3F4F6;
                border-left-color: #9CA3AF;
            }

            .footer {
                background: #4B5563;
                border-top-color: #6B7280;
                color: #D1D5DB;
            }

            .footer a {
                color: #D1D5DB;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>New Contact Form Submission</h1>
        </div>
        <div class="content">
            <p class="intro">You have received a new message from your portfolio website contact form:</p>
            
            <div class="field">
                <div class="label">Name</div>
                <div class="value">{{user_name}}</div>
            </div>
            
            <div class="field">
                <div class="label">Email</div>
                <div class="value">{{user_email}}</div>
            </div>
            
            <div class="field">
                <div class="label">Message</div>
                <div class="value">{{message}}</div>
            </div>
        </div>
        <div class="footer">
            <p>This email was sent from your <a href="{{website_url}}">portfolio website</a> contact form.</p>
        </div>
    </div>
</body>
</html>
